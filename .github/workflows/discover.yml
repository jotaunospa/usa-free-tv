name: Discover channels

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover (does not change the addon)
        run: python generator/discover.py
      - name: Commit discovery.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/discovery.json
          git diff --cached --quiet || git commit -m "chore: channel discovery"
          git push
